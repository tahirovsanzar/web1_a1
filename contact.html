  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/bekzhat.css">
</head>

  <nav class="navbar navbar-expand-md navbar-dark bg-black border-bottom border-danger">
    <div class="container-fluid px-md-4">
      <a class="navbar-brand text-danger fw-bold" href="index.html">EXPERIENCE FITNESS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="mainNav">
        <ul class="navbar-nav gap-2">
          <li class="nav-item"><a class="nav-link text-light" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="colophon.html">Colophon</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link text-light" href="gallery.html">Gallery</a></li>

        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <h1 class="text-danger display-5 fw-bold mb-4 text-center">Contact Us</h1>
      <p class="lead text-center mb-5">Have a question about our clubs or memberships? Send us a message and our team will get back to you.</p>

      <form id="contact-form" class="bg-black p-4 rounded border border-danger shadow">
        <div class="mb-3">
          <label for="contact-name" class="form-label text-light">Full Name</label>
          <input type="text" class="form-control" id="contact-name" placeholder="Enter your full name">
        </div>
        <div class="mb-3">
          <label for="contact-email" class="form-label text-light">Email Address</label>
          <input type="email" class="form-control" id="contact-email" placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label for="contact-subject" class="form-label text-light">Subject</label>
          <select class="form-select" id="contact-subject">
            <option value="" selected disabled>Choose a topic...</option>
            <option value="membership">Membership Prices</option>
            <option value="feedback">Feedback</option>
            <option value="other">Other Inquiry</option>
          </select>
        </div>

        <!-- Feedback uchun zalga kelganlik sonini so'rash (JS uchun maxsus id bilan o'ralgan) -->
        <div class="mb-3" id="feedback-visits-container">
          <label for="contact-visits" class="form-label text-light">How many times have you visited us? (For Feedback)</label>
          <select class="form-select" id="contact-visits">
            <option value="" selected disabled>Select an option...</option>
            <option value="0">I haven't visited yet</option>
            <option value="1">First time</option>
            <option value="2-5">2 to 5 times</option>
            <option value="6+">More than 5 times / Regular member</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="contact-message" class="form-label text-light">Message</label>
          <textarea class="form-control" id="contact-message" rows="5" placeholder="How can we help you?"></textarea>
        </div>
        <button type="submit" id="submit-contact-btn" class="btn btn-danger w-100">Send Message</button>

        <!-- Kelajakda JS xabari chiqadigan joy -->
        <div id="contact-response" class="alert alert-success d-none mt-3 mb-0" role="alert"></div>
      </form>
    </div>
  </div>
</main>
<footer class="bg-black border-top border-danger py-4 mt-5 text-center">
  <div class="container">
    <p class="mb-0 text-light">&copy; 2026 Student Project | Astana, Kazakhstan</p>
  </div>
</footer>
</body>
</html>
